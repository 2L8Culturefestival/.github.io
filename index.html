<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2L8組｜ありがとう</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#eee;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif}
body{min-height:100svh;overflow-x:hidden}.wrap{min-height:100svh;padding:8vh 22px 6vh;display:flex;align-items:center;justify-content:center;position:relative}
